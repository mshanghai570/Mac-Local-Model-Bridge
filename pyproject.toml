[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-gateway"
version = "1.0.0"
description = "Lightweight on-device AI Gateway connecting iPhone, Claude Desktop, and LAN clients to locally hosted models on Apple Silicon Mac."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Local AI Gateway Contributors" }
]
keywords = [
    "ai",
    "gateway",
    "ollama",
    "mcp",
    "apple-silicon",
    "iphone",
    "local-ai",
    "openai-compatible",
    "bonjour",
    "zeroconf"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "zeroconf>=0.131.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=0.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
local-ai-gateway = "local_ai_gateway.main:cli_entry"
bridge = "cli.bridge_runtime:main"
bridge-cli = "cli.mac_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["local_ai_gateway*", "local_model_bridge*", "cli*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
